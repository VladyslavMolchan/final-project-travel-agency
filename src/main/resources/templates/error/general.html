<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100" style="background-color: #dee2e6;">
<div class="alert alert-danger text-center p-4 shadow rounded">
    <h3>❌ Oops! Something went wrong.</h3>
    <p th:text="${errorMessage}">Unexpected error occurred. Please try again later.</p>
    <a href="/" class="btn btn-primary mt-3">⬅ Back to Home</a>
</div>
</body>
</html>
