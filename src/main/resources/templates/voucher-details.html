<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${voucher.title}">Voucher Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .review-form { margin-top: 20px; }
        .review-item { margin-bottom: 10px; }
        .btn-back { margin-top: 20px; }
    </style>
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow-lg rounded-4">
        <div class="card-body">

            <h2 class="text-center text-primary mb-3" th:text="${voucher.title}">Voucher Title</h2>
            <p class="text-center text-muted mb-4" th:text="${voucher.description}">Voucher Description</p>

            <div class="row text-center mb-4">
                <div class="col-md-4"><strong th:text="#{order.voucher.price}">Price:</strong> <span th:text="${voucher.price + ' $'}"></span></div>
                <div class="col-md-4"><strong th:text="#{order.voucher.tourType}">Tour Type:</strong> <span th:text="${voucher.tourType}"></span></div>
                <div class="col-md-4"><strong th:text="#{order.voucher.hotel}">Hotel:</strong> <span th:text="${voucher.hotelType}"></span></div>
            </div>


            <div class="mt-5">
                <h4 class="text-primary mb-3"><i class="bi bi-chat-dots"></i> <span th:text="#{order.voucher.details}">Write a review</span></h4>

                <p class="text-muted fst-italic" th:if="${#lists.isEmpty(reviews)}" th:text="#{reviews.none}">
                    No reviews yet. Be the first!
                </p>

                <div class="list-group mb-4" th:if="${!#lists.isEmpty(reviews)}">
                    <div class="list-group-item review-item" th:each="review : ${reviews}">
                        <div class="d-flex justify-content-between">
                            <h6 class="mb-1 text-primary fw-bold" th:text="${review.userName}">Username</h6>
                            <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}">Date</small>
                        </div>
                        <p class="mb-1" th:text="${review.content}">Review text</p>
                    </div>
                </div>


                <div class="card p-3 shadow-sm review-form">
                    <h5 class="text-secondary mb-3"><i class="bi bi-pencil-square"></i> <span th:text="#{order.voucher.details}">Leave a Review</span></h5>
                    <form th:action="@{/reviews/{voucherId}/add(voucherId=${voucher.id})}" method="post">
                        <div class="mb-3">
                          <textarea class="form-control" name="content" rows="3" maxlength="500"
                                    th:placeholder="#{review.placeholder}" required></textarea>

                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> <span th:text="#{review.submit}">Submit</span></button>
                        </div>
                    </form>
                </div>

                <div class="text-center btn-back">
                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> <span th:text="#{order.button.back}">Back to Dashboard</span>
                    </a>
                </div>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
