<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{site.title}">Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">
</head>
<body>


<div th:if="${registerSuccess}" class="alert alert-success text-center" th:text="${registerSuccess}"></div>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}" th:text="#{site.title}">Travel Agency</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}" th:text="#{nav.home}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}" th:text="#{nav.tours}">Choose tours</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/order/history}" th:text="#{nav.history}">My history</a>
                </li>
            </ul>


            <div class="d-flex align-items-center">

                <div th:if="${username}" class="me-3 d-flex align-items-center">
                    <span class="me-2 fw-semibold text-primary">
                        👤 <span th:text="${username}">User</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm" th:text="#{nav.logout}">Logout</button>
                    </form>
                </div>


                <div th:unless="${username}">
                    <a th:href="@{/auth/sign-in}" class="btn btn-outline-success btn-sm me-2" th:text="#{nav.login}">Sign in</a>
                    <a th:href="@{/auth/register}" class="btn btn-outline-secondary btn-sm me-2" th:text="#{nav.register}">Sign up</a>
                </div>

                <!-- Language Switch -->
                <a th:href="@{/?lang=en}" class="btn btn-sm btn-outline-secondary me-2">English</a>
                <a th:href="@{/?lang=uk}" class="btn btn-sm btn-outline-secondary">Українська</a>
            </div>
        </div>
    </div>
</nav>


<div class="container-fluid p-0">
    <img th:src="@{/tour_agency.jpg}" alt="Tour Image" class="img-fluid d-block w-100" style="height: auto; max-height: 92vh;">
</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
