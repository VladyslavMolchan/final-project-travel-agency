<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{order.details}">Order details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #dee2e6;">
<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
    <div class="bg-white p-4 rounded shadow" style="max-width: 600px; width: 100%;">
        <h2 class="text-center mb-4" th:text="#{order.details}">Order details</h2>

        <div th:if="${order != null}">
            <p><strong>ID:</strong> <span th:text="${order.id}"></span></p>
            <p><strong th:text="#{order.voucher.title}">Voucher ID:</strong> <span th:text="${order.voucherId}"></span></p>
            <p><strong th:text="#{order.customer.name}">Name:</strong> <span th:text="${order.customerName}"></span></p>
            <p><strong th:text="#{order.customer.email}">Email:</strong> <span th:text="${order.customerEmail}"></span></p>
            <p><strong th:text="#{order.status}">Status:</strong> <span th:text="${order.status}"></span></p>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/order/history(email=${order.customerEmail})}"
               class="btn btn-primary"
               th:text="#{order.button.history}">Back to history</a>
        </div>
    </div>
</div>
</body>
</html>
