<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{order.details}">Order Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #dee2e6;">
<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
    <div class="bg-white p-4 rounded shadow" style="max-width: 700px; width: 100%;">
        <h2 class="text-center mb-4" th:text="#{order.details}">Order Details</h2>

        <div th:if="${order != null}">
            <table class="table table-bordered">
                <tbody>
                <tr>
                    <th>ID</th>
                    <td th:text="${order.id}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.voucher.title}">Voucher Title</th>
                    <td th:text="${order.voucherTitle}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.voucher.description}">Description</th>
                    <td th:text="${order.voucherDescription}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.voucher.price}">Price</th>
                    <td th:text="${order.voucherPrice} + ' USD'"></td>
                </tr>
                <tr>
                    <th th:text="#{order.voucher.tourType}">Tour Type</th>
                    <td th:text="${order.voucherTourType}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.voucher.transfer}">Transfer</th>
                    <td th:text="${order.voucherTransferType}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.voucher.hotel}">Hotel</th>
                    <td th:text="${order.voucherHotelType}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.voucher.arrival}">Arrival Date</th>
                    <td th:text="${order.voucherArrivalDate}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.voucher.eviction}">Eviction Date</th>
                    <td th:text="${order.voucherEvictionDate}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.customer.name}">Customer Name</th>
                    <td th:text="${order.customerName}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.customer.email}">Customer Email</th>
                    <td th:text="${order.customerEmail}"></td>
                </tr>
                <tr>
                    <th th:text="#{order.status}">Status</th>
                    <td th:text="${order.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/order/receipt/{orderId}(orderId=${order.id})}" class="btn btn-info" th:text="#{order.button.download}">Download Receipt (PDF)</a>
        </div>

        <div class="text-center mt-3">
            <a th:href="@{/order/history}" class="btn btn-secondary" th:text="#{order.button.back}">Back to history</a>
        </div>
    </div>
</div>
</body>
</html>
