<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="#{nav.dashboard}">Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    td.price-col { min-width: 100px; white-space: nowrap; }
    td.arrival-col, td.eviction-col { min-width: 120px; white-space: nowrap; }
    td.description-col { white-space: normal; word-wrap: break-word; max-width: 250px; }
    .table td, .table th { vertical-align: middle; }
    .sortable a { color: inherit; text-decoration: none; }
  </style>
</head>
<body style="background-color: #dee2e6;">
<div class="container mt-4" th:with="searchVal=${search ?: ''}, sortVal=${sortBy ?: 'title'}, dirVal=${direction ?: 'asc'}, toggleDir=${direction == 'asc' ? 'desc' : 'asc'}">

  <h1 class="text-center mb-4" th:text="#{nav.dashboard}">Dashboard</h1>

  <div class="mb-3">
    <a th:href="@{/}" class="btn btn-primary" th:text="#{order.button.back}">⬅ Back</a>
  </div>


  <!-- Search form -->
  <form th:action="@{/dashboard}" method="get" class="row g-2 mb-3">
    <div class="col-md-4">
      <input type="text" name="search" th:value="${searchVal}" class="form-control"
             th:placeholder="#{search.placeholder}" placeholder="Search…">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100" type="submit" th:text="#{search.button}">Search</button>
    </div>
  </form>

  <!-- Vouchers Table -->
  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-primary">
      <tr>
        <th class="sortable">
          <a th:href="@{/dashboard(page=0, sortBy='id', direction=${toggleDir}, search=${searchVal})}">#ID</a>
        </th>
        <th class="sortable">
          <a th:href="@{/dashboard(page=0, sortBy='title', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.title}">Title</a>
        </th>
        <th th:text="#{order.voucher.description}">Description</th>
        <th class="sortable">
          <a th:href="@{/dashboard(page=0, sortBy='price', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.price}">Price</a>
        </th>
        <th class="sortable"><a th:href="@{/dashboard(page=0, sortBy='tourType', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.tourType}">Tour Type</a></th>
        <th class="sortable"><a th:href="@{/dashboard(page=0, sortBy='transferType', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.transfer}">Transfer</a></th>
        <th class="sortable"><a th:href="@{/dashboard(page=0, sortBy='hotelType', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.hotel}">Hotel</a></th>
        <th class="sortable"><a th:href="@{/dashboard(page=0, sortBy='status', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.status}">Status</a></th>
        <th class="sortable"><a th:href="@{/dashboard(page=0, sortBy='arrivalDate', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.arrival}">Arrival</a></th>
        <th class="sortable"><a th:href="@{/dashboard(page=0, sortBy='evictionDate', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.eviction}">Eviction</a></th>
        <th class="sortable"><a th:href="@{/dashboard(page=0, sortBy='hot', direction=${toggleDir}, search=${searchVal})}" th:text="#{order.voucher.hot}">Hot</a></th>
        <th th:text="#{order.actions}">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:if="${noResults}">
        <td colspan="12" class="text-center text-danger" th:text="#{search.noresults}">No results found 😔</td>
      </tr>
      <tr th:each="voucher : ${vouchers}">
        <td th:text="${#strings.substring(voucher.id,0,8)}"></td>
        <td th:text="${voucher.title}"></td>
        <td th:text="${voucher.description}" class="description-col"></td>
        <td th:text="${voucher.price + ' $'}" class="price-col"></td>
        <td th:text="${voucher.tourType}"></td>
        <td th:text="${voucher.transferType}"></td>
        <td th:text="${voucher.hotelType}"></td>
        <td th:text="${voucher.status}"></td>
        <td th:text="${voucher.arrivalDate}"></td>
        <td th:text="${voucher.evictionDate}"></td>
        <td th:text="${voucher.hot} ? #{order.voucher.hot.yes} : #{order.voucher.hot.no}"></td>
        <td>
          <a th:href="@{/order/{id}(id=${voucher.id})}" class="btn btn-sm btn-success w-100" th:text="#{order.button.place}">Place Order</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <nav th:if="${totalPages > 0}">
    <ul class="pagination justify-content-center">
      <li th:each="i : ${#numbers.sequence(0, totalPages-1)}"
          th:classappend="${i} == ${currentPage} ? 'active' : ''" class="page-item">
        <a th:href="@{/dashboard(page=${i}, sortBy=${sortVal}, direction=${dirVal}, search=${searchVal})}" th:text="${i+1}" class="page-link"></a>
      </li>
    </ul>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
