<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8"/>
    <title th:text="#{order.button.place}">Order voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body style="background-color: #dee2e6;">

<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
    <div class="bg-white p-4 rounded shadow" style="max-width: 600px; width: 100%;">
        <h2 class="text-center mb-4" th:text="#{order.button.place}">Order voucher</h2>

        <div th:if="${voucher != null}" class="mb-4">
            <h5 class="text-center" th:text="${voucher.title}">Voucher title</h5>
            <p th:text="${voucher.description}">Description</p>
            <p><strong th:text="#{order.voucher.price}">Price:</strong> <span th:text="${voucher.price}"></span> $</p>
            <p><strong th:text="#{order.voucher.tourType}">Tour type:</strong> <span th:text="${voucher.tourType}"></span></p>
            <p><strong th:text="#{order.voucher.transfer}">Transfer:</strong> <span th:text="${voucher.transferType}"></span></p>
            <p><strong th:text="#{order.voucher.hotel}">Hotel:</strong> <span th:text="${voucher.hotelType}"></span></p>
            <p><strong th:text="#{order.voucher.status}">Status:</strong> <span th:text="${voucher.status}"></span></p>
        </div>

        <form th:action="@{/order}" th:object="${order}" method="post" class="text-center">
            <input type="hidden" th:field="*{voucherId}"/>
            <button class="btn btn-success me-2" type="submit" th:text="#{order.button.place}">Place order</button>
            <a class="btn btn-primary" th:href="@{/dashboard}" th:text="#{order.button.back}">Back</a>
        </form>
    </div>
</div>

</body>
</html>
