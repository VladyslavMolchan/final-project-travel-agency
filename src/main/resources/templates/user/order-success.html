<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{order.success.title}">Order Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100" style="background-color: #dee2e6;">

<div class="alert alert-success text-center p-4 shadow rounded">
    <h3 th:text="#{order.success.title}">✅ Your order was successfully placed!</h3>
    <hr>
    <h5>👤 <span th:text="#{order.customer.name}">Customer details:</span></h5>
    <p><strong th:text="#{order.customer.name}">Name:</strong> <span th:text="${order.customerName}"></span></p>
    <p><strong th:text="#{order.customer.email}">Email:</strong> <span th:text="${order.customerEmail}"></span></p>

    <h5 class="mt-3">🏖️ <span th:text="#{order.voucher.title}">Voucher details:</span></h5>
    <p><strong th:text="#{order.voucher.title}">Title:</strong> <span th:text="${voucher.title}"></span></p>
    <p><strong th:text="#{order.voucher.description}">Description:</strong> <span th:text="${voucher.description}"></span></p>
    <p><strong th:text="#{order.voucher.price}">Price:</strong> <span th:text="${voucher.price}"></span> $</p>
    <p><strong th:text="#{order.voucher.tourType}">Tour type:</strong> <span th:text="${voucher.tourType}"></span></p>
    <p><strong th:text="#{order.voucher.hotel}">Hotel:</strong> <span th:text="${voucher.hotelType}"></span></p>
    <p><strong th:text="#{order.voucher.arrival}">Arrival:</strong> <span th:text="${voucher.arrivalDate}"></span></p>
    <p><strong th:text="#{order.voucher.eviction}">Eviction:</strong> <span th:text="${voucher.evictionDate}"></span></p>

    <div class="d-flex justify-content-center gap-2 mt-3">
        <a href="/dashboard" class="btn btn-primary" th:text="#{order.button.tours}">⬅ Back to choose tours</a>
        <a th:href="@{/order/history(email=${order.customerEmail})}" class="btn btn-secondary" th:text="#{order.button.history}">Back to history</a>
    </div>


</div>

</body>
</html>
