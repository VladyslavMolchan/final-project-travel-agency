<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{order.history}">Order history</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4" style="background-color: #dee2e6;">
<h2 th:text="#{order.history}">Your Orders</h2>

<table class="table table-bordered table-hover align-middle">
    <thead class="table-primary">
    <tr>
        <th>ID</th>
        <th>Voucher</th>
        <th th:text="#{order.customer.name}">Name</th>
        <th th:text="#{order.customer.email}">Email</th>
        <th th:text="#{order.status}">Status</th>
        <th th:text="#{order.actions}">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${orders.isEmpty()}">
        <td colspan="6" class="text-center text-danger">No orders found 😔</td>
    </tr>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.voucherId}"></td>
        <td th:text="${order.customerName}"></td>
        <td th:text="${order.customerEmail}"></td>
        <td th:text="${order.status}"></td>
        <td>
            <a th:href="@{/order/view/{orderId}(orderId=${order.id})}" class="btn btn-sm btn-primary">View</a>
            <form th:action="@{/order/cancel/{orderId}(orderId=${order.id})}" method="post" style="display:inline;">
                <button class="btn btn-sm btn-danger">Cancel</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}" class="btn btn-secondary" th:text="#{order.button.back}">Back</a>
</body>
</html>
