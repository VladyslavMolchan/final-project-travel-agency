<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{order.failed.title}">Order Failed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100" style="background-color: #dee2e6;">
<div class="alert alert-danger text-center p-4 shadow rounded">
    <h3 th:text="#{order.failed.title}">❌ Failed to place your order!</h3>
    <hr>
    <p th:if="${errorMessage != null}" th:text="${errorMessage}">Unknown error occurred. Please try again later.</p>
    <p th:if="${errorMessage == null}" th:text="#{order.failed.message}">Unknown error occurred. Please try again later.</p>
    <a href="/dashboard" class="btn btn-primary mt-3" th:text="#{order.button.tours}">⬅ Back to tours</a>
</div>
</body>
</html>
