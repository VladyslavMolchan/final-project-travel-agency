<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{reset.password.title}">Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #dee2e6;">
<div class="container mt-5" style="max-width: 600px;">
    <h2 class="text-center mb-4" th:text="#{reset.password.title}">Reset Password</h2>

    <form th:action="@{/auth/reset-password}" th:object="${resetPassword}" method="post">
        <input type="hidden" name="token" th:value="${token}" />

        <div class="mb-3">
            <label for="password" class="form-label" th:text="#{reset.password.new}">New Password</label>
            <input type="password" id="password" class="form-control" th:field="*{password}" th:placeholder="#{reset.password.new}" required />
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label" th:text="#{reset.password.confirm}">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}" th:placeholder="#{reset.password.confirm}" required />
            <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{reset.button.submit}">Reset Password</button>
    </form>
</div>
</body>
</html>
