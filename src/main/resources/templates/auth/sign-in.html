<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #dee2e6;">
<div class="container mt-5" style="max-width: 600px;">
    <h2 class="text-center mb-4" th:text="#{login.title}">Sign In</h2>

    <!-- Flash messages -->
    <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
    <div th:if="${loginSuccess}" class="alert alert-success" th:text="${loginSuccess}"></div>

    <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post" novalidate>


        <div class="mb-3">
            <label for="username" class="form-label" th:text="#{login.username}">Username</label>
            <input type="text" id="username" class="form-control" th:field="*{username}"
                   minlength="3" maxlength="30"
                   pattern="^[a-zA-Z0-9._-]+$"
                   required>
            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>


        <div class="mb-3">
            <label for="password" class="form-label" th:text="#{login.password}">Password</label>
            <input type="password" id="password" class="form-control" th:field="*{password}"
                   minlength="7" maxlength="64"
                   required>
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{login.submit}">Login</button>
    </form>

    <div class="mt-3 text-center">
        <a class="btn btn-outline-danger w-100" th:href="@{/oauth2/authorization/google}">
            <i class="bi bi-google"></i> Sign in with Google
        </a>
    </div>


    <div class="mt-3 text-center">
        <a th:href="@{/auth/forgot-password}" class="btn btn-link" th:text="#{login.forgotPassword}">Forgot password?</a>
    </div>
</div>
</body>
</html>
