<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{register.title}">Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .required::after {
         content: " *";
         color: red;
     }

     body {
         background-color: #dee2e6;
     }

    </style>
</head>
<body>
<div class="container mt-5" style="max-width: 600px;">



    <div th:if="${registerError}" class="alert alert-danger" th:text="${registerError}"></div>
    <div th:if="${registerSuccess}" class="alert alert-success" th:text="${registerSuccess}"></div>
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <h2 class="text-center mb-4" th:text="#{register.header}">Create Account</h2>

    <form th:action="@{/auth/register}" th:object="${user}" method="post" novalidate>


        <div class="mb-3">
            <label for="username" class="form-label required" th:text="#{register.username}">Username</label>
            <input type="text" id="username" class="form-control" th:field="*{username}"
                   minlength="3" maxlength="30"
                   pattern="^[a-zA-Z0-9._-]+$"
                   required>
            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>


        <div class="mb-3">
            <label for="email" class="form-label required" th:text="#{register.email}">Email</label>
            <input type="email" id="email" class="form-control" th:field="*{email}"
                   maxlength="50" required>
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>


        <div class="mb-3">
            <label for="phoneNumber" class="form-label" th:text="#{register.phone}">Phone Number</label>
            <input type="tel" id="phoneNumber" class="form-control" th:field="*{phoneNumber}"
                   maxlength="25"
                   pattern="^(\+\d{1,3}( )?)?\d{7,15}$"
                   placeholder="+380XXXXXXXXX">
            <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
        </div>


        <div class="mb-3">
            <label for="password" class="form-label required" th:text="#{register.password}">Password</label>
            <input type="password" id="password" class="form-control" th:field="*{password}"
                   minlength="7" maxlength="64"
                   pattern="^(?=.*[0-9])(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':\\|,.<>/?]).+$"
                   required>
            <small class="form-text text-primary" th:text="#{register.password.hint}">
                Must contain at least 7 characters, one uppercase letter, one digit, and one special character.
            </small>
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>


        <div class="mb-3">
            <label for="confirmPassword" class="form-label required" th:text="#{register.confirmPassword}">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}"
                   minlength="7" maxlength="64" required>
            <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{register.submit}">Register</button>
    </form>

    <div class="mt-3 text-center">
        <a class="btn btn-outline-danger w-100" th:href="@{/oauth2/authorization/google}">
            <i class="bi bi-google"></i> Sign in with Google
        </a>
    </div>

</div>
</body>
</html>
