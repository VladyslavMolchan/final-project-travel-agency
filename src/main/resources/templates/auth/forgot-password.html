<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.forgotPassword}">Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #dee2e6;">
<div class="container mt-5" style="max-width: 600px;">
    <h2 class="text-center mb-4" th:text="#{login.forgotPassword}">Forgot Password</h2>


    <div th:if="${message}" class="alert alert-success text-center" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>


    <form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label" th:text="#{reset.email}">Enter your email address</label>
            <input type="email" id="email" class="form-control" th:field="*{email}"
                   placeholder="you@example.com" required maxlength="50">
            <div class="text-danger mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{reset.button.sendlink}">
            Send Reset Link
        </button>
    </form>
</div>
</body>
</html>
